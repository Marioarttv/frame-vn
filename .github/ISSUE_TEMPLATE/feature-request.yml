name: Feature request
description: Describe a creator workflow that Frame could support better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to create?
      description: Explain the workflow and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives or a concrete example when helpful.
    validations:
      required: true
